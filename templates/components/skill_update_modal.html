<div id="update-skill-modal"
     class="project-form-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="update-skill-modal-title">
    <button type="button"
            class="project-form-modal__backdrop"
            popovertarget="update-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup form update skill"></button>

    <div class="project-form-modal__content">
        <button type="button"
                class="project-form-modal__close"
                popovertarget="update-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup form update skill">×</button>

        <h2 id="update-skill-modal-title">Update Skill Baru</h2>
        
        <form id="update-skill-form"
              method="post"
              class="experience-form">
            {% csrf_token %}
            {% for field in form %}
                <div class="form-group">
                    <label for="{{ field.id_for_label }}">{{ field.label }}</label>
                    {{ field }}
                    {% for error in field.errors %}
                        <p class="form-error">{{ error }}</p>
                    {% endfor %}
                </div>
            {% endfor %}


            <div class="project-form-modal__actions">
                <button type="button"
                        class="button button-secondary"
                        popovertarget="update-skill-modal"
                        popovertargetaction="hide">Batal</button>
                <button type="submit" class="button">Update Skill</button>
            </div>
        </form>
    </div>
</div>
