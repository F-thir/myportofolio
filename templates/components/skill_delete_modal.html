<div id="delete-skill-modal"
     class="project-delete-modal"
     popover="auto"
     role="dialog"
     aria-modal="true"
     aria-labelledby="delete-skill-modal-title">
    <button type="button"
            class="project-delete-modal__backdrop"
            popovertarget="delete-skill-modal"
            popovertargetaction="hide"
            aria-label="Tutup konfirmasi hapus"></button>
    <div class="project-delete-modal__content">
        <button type="button"
                class="project-delete-modal__close"
                popovertarget="delete-skill-modal"
                popovertargetaction="hide"
                aria-label="Tutup konfirmasi hapus">×</button>
        <h2 id="delete-skill-modal-title">Hapus Skill?</h2>
        <p>
            Apakah Anda yakin ingin menghapus
            <strong id="delete-skill-name"></strong>?
        </p>
        <div class="project-delete-modal__actions">
            <button type="button"
                    class="button button-secondary"
                    popovertarget="delete-skill-modal"
                    popovertargetaction="hide">Batal</button>
            <button type="button"
                    id="confirm-delete-skill"
                    class="button button-danger">Ya, Hapus</button>
        </div>
    </div>
</div>
